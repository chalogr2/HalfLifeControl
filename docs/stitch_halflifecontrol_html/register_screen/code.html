<!DOCTYPE html>

<html lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Register | HalfLifeControl</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Lexend:wght@300;400;500;600;700&amp;family=Plus+Jakarta+Sans:wght@300;400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "on-secondary-fixed-variant": "#005048",
                        "on-tertiary-container": "#ffcea9",
                        "tertiary-fixed": "#ffdcc3",
                        "surface-variant": "#e2e2e5",
                        "on-error-container": "#93000a",
                        "on-background": "#1a1c1e",
                        "secondary-fixed-dim": "#84d5c8",
                        "tertiary-container": "#904c00",
                        "on-primary-container": "#a2e1ff",
                        "secondary": "#016a60",
                        "primary-fixed": "#bee9ff",
                        "secondary-container": "#9ff2e4",
                        "inverse-surface": "#2f3033",
                        "surface-container": "#eeedf1",
                        "surface-bright": "#faf9fc",
                        "surface-container-lowest": "#ffffff",
                        "tertiary-fixed-dim": "#ffb77d",
                        "outline-variant": "#bfc8cd",
                        "on-surface": "#1a1c1e",
                        "error": "#ba1a1a",
                        "outline": "#70787e",
                        "on-secondary-fixed": "#00201c",
                        "inverse-primary": "#87d0f2",
                        "secondary-fixed": "#9ff2e4",
                        "inverse-on-surface": "#f1f0f4",
                        "surface-container-highest": "#e2e2e5",
                        "on-primary-fixed-variant": "#004d64",
                        "tertiary": "#6d3800",
                        "on-secondary": "#ffffff",
                        "primary-container": "#006684",
                        "primary": "#004d64",
                        "error-container": "#ffdad6",
                        "on-tertiary": "#ffffff",
                        "surface-tint": "#016684",
                        "surface-container-low": "#f4f3f6",
                        "background": "#faf9fc",
                        "on-tertiary-fixed": "#2f1500",
                        "on-primary": "#ffffff",
                        "on-error": "#ffffff",
                        "surface": "#faf9fc",
                        "on-secondary-container": "#117166",
                        "on-tertiary-fixed-variant": "#6e3900",
                        "on-surface-variant": "#3f484d",
                        "on-primary-fixed": "#001f2a",
                        "surface-container-high": "#e8e8eb",
                        "surface-dim": "#dadadd",
                        "primary-fixed-dim": "#87d0f2"
                    },
                    fontFamily: {
                        "headline": ["Lexend"],
                        "body": ["Plus Jakarta Sans"],
                        "label": ["Plus Jakarta Sans"]
                    },
                    borderRadius: {"DEFAULT": "0.25rem", "lg": "0.5rem", "xl": "0.75rem", "full": "9999px"},
                },
            },
        }
    </script>
<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
        }
        h1, h2, h3, .font-lexend {
            font-family: 'Lexend', sans-serif;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-surface text-on-surface min-h-screen flex flex-col">
<!-- Top Navigation Anchor -->
<header class="flex items-center justify-center h-20 px-6 w-full bg-white dark:bg-slate-950">
<div class="flex items-center gap-2">
<span class="material-symbols-outlined text-teal-900 dark:text-teal-100 text-3xl" data-icon="shield_with_heart" style="font-variation-settings: 'FILL' 1;">shield_with_heart</span>
<span class="text-teal-900 dark:text-teal-100 font-lexend font-bold text-2xl tracking-tighter">HalfLifeControl</span>
</div>
</header>
<main class="flex-grow flex items-center justify-center px-4 py-12">
<div class="w-full max-w-md space-y-8">
<!-- Title Section -->
<div class="text-center space-y-2">
<h1 class="text-primary font-headline text-4xl font-bold tracking-tight">Create Account</h1>
<p class="text-on-surface-variant font-body text-lg">Start your journey to better health management.</p>
</div>
<!-- Registration Form -->
<div class="bg-surface-container-lowest rounded-3xl p-8 shadow-2xl shadow-primary/5 space-y-6">
<form action="#" class="space-y-6">
<!-- Email Field -->
<div class="space-y-2">
<label class="block font-label text-sm font-semibold text-on-surface-variant px-1" for="email">Email Address</label>
<div class="relative group">
<input class="w-full h-14 px-4 bg-surface-container-high border-none rounded-xl focus:ring-2 focus:ring-primary transition-all text-on-surface placeholder:text-outline" id="email" name="email" placeholder="name@example.com" required="" type="email"/>
<span class="absolute right-4 top-4 text-outline material-symbols-outlined" data-icon="mail">mail</span>
</div>
</div>
<!-- Password Field -->
<div class="space-y-2">
<label class="block font-label text-sm font-semibold text-on-surface-variant px-1" for="password">Password</label>
<div class="relative group">
<input class="w-full h-14 px-4 bg-surface-container-high border-none rounded-xl focus:ring-2 focus:ring-primary transition-all text-on-surface placeholder:text-outline" id="password" name="password" placeholder="••••••••" required="" type="password"/>
<span class="absolute right-4 top-4 text-outline material-symbols-outlined" data-icon="lock">lock</span>
</div>
</div>
<!-- Confirm Password Field -->
<div class="space-y-2">
<label class="block font-label text-sm font-semibold text-on-surface-variant px-1" for="confirm_password">Confirm Password</label>
<div class="relative group">
<input class="w-full h-14 px-4 bg-surface-container-high border-none rounded-xl focus:ring-2 focus:ring-primary transition-all text-on-surface placeholder:text-outline" id="confirm_password" name="confirm_password" placeholder="••••••••" required="" type="password"/>
<span class="absolute right-4 top-4 text-outline material-symbols-outlined" data-icon="enhanced_encryption">enhanced_encryption</span>
</div>
</div>
<!-- Terms Checkbox -->
<div class="flex items-start gap-3 px-1">
<div class="flex items-center h-6">
<input class="h-5 w-5 rounded border-outline-variant text-primary focus:ring-primary" id="terms" name="terms" required="" type="checkbox"/>
</div>
<label class="text-sm text-on-surface-variant font-body leading-tight" for="terms">
                            I agree to the <a class="text-primary font-semibold hover:underline" href="#">Terms of Service</a> and <a class="text-primary font-semibold hover:underline" href="#">Privacy Policy</a>.
                        </label>
</div>
<!-- Submit Button -->
<button class="w-full h-16 bg-gradient-to-r from-primary to-primary-container text-on-primary font-headline text-lg font-bold rounded-2xl shadow-lg shadow-primary/20 active:scale-95 transition-transform" type="submit">
                        Register
                    </button>
</form>
<!-- Divider -->
<div class="relative py-4">
<div aria-hidden="true" class="absolute inset-0 flex items-center">
<div class="w-full border-t border-outline-variant/40"></div>
</div>
<div class="relative flex justify-center text-sm font-label uppercase tracking-widest">
<span class="bg-surface-container-lowest px-4 text-outline">Or continue with</span>
</div>
</div>
<!-- Social Buttons -->
<div class="grid grid-cols-2 gap-4">
<button class="flex items-center justify-center h-14 gap-3 bg-surface-container-low border border-outline-variant/30 rounded-xl font-label font-semibold text-on-surface hover:bg-surface-container-high transition-colors active:scale-95">
<span class="material-symbols-outlined text-red-600" data-icon="google_plus_rescale">google_plus_reshare</span>
                        Google
                    </button>
<button class="flex items-center justify-center h-14 gap-3 bg-surface-container-low border border-outline-variant/30 rounded-xl font-label font-semibold text-on-surface hover:bg-surface-container-high transition-colors active:scale-95">
<span class="material-symbols-outlined" data-icon="apple" style="font-variation-settings: 'FILL' 1;">ios</span>
                        Apple
                    </button>
</div>
</div>
<!-- Footer Link -->
<p class="text-center font-body text-on-surface-variant">
                Already have an account? 
                <a class="text-primary font-bold hover:underline" href="#">Login</a>
</p>
</div>
</main>
<!-- Bottom Navigation Shell (Suppressed based on Task-Focused rule, but showing for context of identity if required by user as "Register" screen) -->
<!-- The JSON mandate says only for top-level destinations. Register is transactional. We keep the bar but style it for Login/Register as per JSON destination_count 2 -->
<nav class="fixed bottom-0 left-0 w-full z-50 flex justify-around items-center px-4 pb-8 pt-4 bg-white/80 dark:bg-slate-950/80 backdrop-blur-xl shadow-2xl shadow-teal-900/5 rounded-t-3xl border-t border-slate-100 dark:border-slate-800 md:hidden">
<a class="flex flex-col items-center justify-center text-slate-500 dark:text-slate-400 px-6 py-2 hover:text-teal-700 dark:hover:text-teal-300 active:scale-90 transition-transform" href="#">
<span class="material-symbols-outlined" data-icon="login">login</span>
<span class="font-plus-jakarta text-sm font-semibold">Login</span>
</a>
<a class="flex flex-col items-center justify-center bg-teal-100 dark:bg-teal-900/40 text-teal-900 dark:text-teal-50 rounded-2xl px-6 py-2 transition-all active:scale-90" href="#">
<span class="material-symbols-outlined" data-icon="person_add" style="font-variation-settings: 'FILL' 1;">person_add</span>
<span class="font-plus-jakarta text-sm font-semibold">Register</span>
</a>
</nav>
</body></html>
