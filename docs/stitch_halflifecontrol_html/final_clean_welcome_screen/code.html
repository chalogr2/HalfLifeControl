<body class="bg-surface font-body text-on-surface min-h-screen flex flex-col">

<header class="fixed top-0 w-full z-50 bg-white/80 dark:bg-slate-900/80 backdrop-blur-xl flex justify-between items-center px-6 py-6 w-full max-w-none">

</div>
</header>
<main class="flex-grow flex flex-col items-center justify-center px-6 pt-24 pb-12 max-w-2xl mx-auto w-full">
<!-- Illustration Section -->
<div class="relative w-full aspect-square max-w-[320px] mb-12 flex items-center justify-center"><!-- Hero Image -->
<div class="relative z-10 w-full h-full rounded-2xl overflow-hidden shadow-2xl">
<img alt="Empathetic healthcare visual" class="w-full h-full object-cover" data-alt="Modern high-end medical scene with a transparent pill bottle and soft morning sunlight on a clean white table" src="https://lh3.googleusercontent.com/aida-public/AB6AXuAQKNmURYCuk83NF7T5q4CVmmyfrOV42DRpqNysVNfP-3Y8Ewe-3_nMEb7mvCcGpCuFKIIrm5JusJ_TZ-59nseEXmo5_vyxShAIkXstVo-N0wC3oJWMBmTcNFwfBEWy2dAbNtwxX4dIwMKvmY0hMYEBnmwfAo3HmbvmF1aiwOtVHq81y6cnx0UCVG6sm_P5UWJY-BuAR4ZyHprQ9qsmACgsRKvmni-2FRUvvTIuGOcHPg_urhdIVO_ke-75h8RtIvOilWUAZB68lPt1"/>
</div>
<!-- Floating Badge -->
</div>
<!-- Text Content -->
<div class="text-center space-y-4 mb-12">
<h2 class="font-headline font-extrabold text-4xl md:text-5xl text-on-surface leading-[1.15] tracking-tight">
                Let’s manage your medications together.
            </h2>
<p class="text-lg md:text-xl text-on-surface-variant max-w-[85%] mx-auto leading-relaxed">
                Start by setting up your daily pill stack or tracking a single pill.
            </p>
</div>
<!-- Action Buttons -->
<div class="w-full space-y-6">
<!-- Primary Action -->
<button class="group relative w-full bg-gradient-to-r from-primary to-primary-container text-white rounded-2xl flex items-center transition-all active:scale-95 shadow-lg shadow-primary/10 px-8 py-8 md:px-12 md:py-10 gap-8 px-10 py-10 md:px-14 md:py-12">
<div class="flex-grow text-left"><span class="block font-headline font-bold text-xl">Yes, I take pills on a schedule</span>
<span class="text-sm opacity-80 font-medium">Set up your daily routine</span></div>
<div class="bg-white/20 rounded-xl group-hover:bg-white/30 transition-colors p-4">
<span class="material-symbols-outlined text-2xl" data-icon="calendar_today">calendar_today</span>
</div>
</button>
<!-- Secondary Action -->
<button class="group w-full bg-surface-container-low hover:bg-surface-container-high text-on-surface-variant rounded-2xl flex items-center transition-all active:scale-95 border border-outline-variant/20 px-8 py-8 md:px-12 md:py-10 gap-8 px-10 py-10 md:px-14 md:py-12">
<div class="flex-grow text-left"><span class="block font-headline font-bold text-xl text-on-surface">No, I just want to track a pill now</span>
<span class="text-sm font-medium">Quick entry for occasional relief</span></div>
<div class="bg-primary/5 rounded-xl text-primary p-4">
<span class="material-symbols-outlined text-2xl" data-icon="add_circle">add_circle</span>
</div>
</button>
