<style>
      .material-symbols-outlined {
        font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
      }
      .glass-effect {
        background: rgba(255, 255, 255, 0.8);
        backdrop-filter: blur(20px);
      }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-surface font-body text-on-surface min-h-screen flex flex-col">
<!-- TopAppBar Mapping from JSON -->
<header class="w-full top-0 border-none bg-white dark:bg-slate-950 flex items-center justify-center h-20 px-6 w-full z-50">
<div class="flex items-center gap-3">
<span class="material-symbols-outlined text-teal-900 dark:text-teal-100 text-3xl" data-icon="shield_with_heart">shield_with_heart</span>
<h1 class="font-lexend text-2xl font-bold tracking-tight text-teal-900 dark:text-teal-100">Guardian</h1>
</div>
</header>
<main class="flex-grow flex items-center justify-center px-6 py-12">
<div class="w-full max-w-md">
<!-- Hero Editorial Section -->
<div class="mb-12 text-center">
<h2 class="font-headline text-4xl font-bold text-primary tracking-tight mb-2">Login</h2>
<p class="text-on-surface-variant font-medium">Welcome back to HalfLifeControl</p>
</div>
<!-- Card Layering Principle -->
<div class="bg-surface-container-lowest rounded-[2rem] p-8 md:p-10 shadow-2xl shadow-on-surface/5">
<form action="#" class="space-y-6">
<!-- Email Field -->
<div class="space-y-2">
<label class="block font-label font-semibold text-primary ml-1" for="email">Email Address</label>
<div class="relative">
<input class="w-full h-16 px-6 rounded-xl bg-surface-container-high border-none focus:ring-2 focus:ring-primary focus:ring-offset-2 transition-all text-on-surface placeholder:text-outline" id="email" placeholder="name@example.com" type="email"/>
</div>
</div>
<!-- Password Field -->
<div class="space-y-2">
<div class="flex justify-between items-center px-1">
<label class="block font-label font-semibold text-primary" for="password">Password</label>
<a class="text-sm font-semibold text-primary hover:text-primary-container transition-colors" href="#">Forgot Password?</a>
</div>
<div class="relative">
<input class="w-full h-16 px-6 rounded-xl bg-surface-container-high border-none focus:ring-2 focus:ring-primary focus:ring-offset-2 transition-all text-on-surface placeholder:text-outline" id="password" placeholder="••••••••" type="password"/>
</div>
</div>
<!-- Main CTA: Pill-like dimensionality -->
<button class="w-full h-16 bg-gradient-to-r from-primary to-primary-container text-on-primary rounded-xl font-headline font-bold text-lg shadow-lg shadow-primary/20 hover:scale-[1.02] active:scale-95 transition-all flex items-center justify-center gap-2 mt-4" type="submit">
<span>Login</span>
<span class="material-symbols-outlined" data-icon="login">login</span>
</button>
</form>
<!-- Divider -->
<div class="relative my-10 flex items-center">
<div class="flex-grow border-t border-outline-variant/40"></div>
<span class="flex-shrink mx-4 text-sm font-semibold text-outline uppercase tracking-widest">Or continue with</span>
<div class="flex-grow border-t border-outline-variant/40"></div>
</div>
<!-- Social Logins -->
<div class="grid grid-cols-2 gap-4">
<button class="h-14 flex items-center justify-center gap-3 bg-surface-container-low hover:bg-surface-container-high rounded-xl transition-all border border-transparent hover:border-outline-variant/20">
<svg class="w-5 h-5" viewbox="0 0 24 24">
<path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"></path>
<path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"></path>
<path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l3.66-2.84z" fill="#FBBC05"></path>
<path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"></path>
</svg>
<span class="font-bold text-sm text-on-surface">Google</span>
</button>
<button class="h-14 flex items-center justify-center gap-3 bg-surface-container-low hover:bg-surface-container-high rounded-xl transition-all border border-transparent hover:border-outline-variant/20">
<svg class="w-5 h-5 fill-on-surface" viewbox="0 0 24 24">
<path d="M17.05 20.28c-.98.95-2.05.8-3.08.35-1.09-.46-2.09-.48-3.24 0-1.44.62-2.2.44-3.06-.35C2.79 15.25 3.51 7.59 9.05 7.31c1.35.07 2.29.74 3.11.78.92-.1 2.06-.88 3.58-.74 1.34.07 4.27.56 5.48 3.84-2.79 1.25-2.33 5.05.41 6.16-.7 1.83-1.63 3.41-2.58 4.35zM12.03 7.25c-.02-2.23 1.76-4.07 3.9-4.14.2 2.37-1.88 4.31-3.9 4.14z"></path>
</svg>
<span class="font-bold text-sm text-on-surface">Apple</span>
</button>
</div>
</div>
<!-- Footer Navigation -->
<div class="mt-8 text-center">
<p class="font-body text-on-surface-variant">
                    Don't have an account? 
                    <a class="text-primary font-bold hover:underline transition-all" href="#">Register</a>
</p>
</div>
</div>
</main>
<!-- BottomNavBar Mapping from JSON - Active logic for Login -->
<nav class="fixed bottom-0 left-0 w-full z-50 flex justify-around items-center px-4 pb-8 pt-4 bg-white/80 dark:bg-slate-950/80 backdrop-blur-xl rounded-t-3xl border-t border-slate-100 dark:border-slate-800 shadow-2xl shadow-teal-900/5">
<a class="flex flex-col items-center justify-center bg-teal-100 dark:bg-teal-900/40 text-teal-900 dark:text-teal-50 rounded-2xl px-6 py-2 transition-all" href="#">
<span class="material-symbols-outlined" data-icon="login" style="font-variation-settings: 'FILL' 1;">login</span>
<span class="font-plus-jakarta text-sm font-semibold">Login</span>
</a>
<a class="flex flex-col items-center justify-center text-slate-500 dark:text-slate-400 px-6 py-2 hover:text-teal-700 dark:hover:text-teal-300 active:scale-90 transition-transform" href="#">
<span class="material-symbols-outlined" data-icon="person_add">person_add</span>
<span class="font-plus-jakarta text-sm font-semibold">Register</span>
</a>
</nav>
<!-- Background Decoration for Premium Feel -->
<div class="fixed top-0 left-0 -z-10 w-full h-full overflow-hidden opacity-30 pointer-events-none">
<div class="absolute -top-[10%] -right-[10%] w-[50%] h-[50%] rounded-full blur-[120px] bg-primary/20"></div>
<div class="absolute -bottom-[10%] -left-[10%] w-[40%] h-[40%] rounded-full blur-[100px] bg-secondary/15"></div>
</div>
</body></html>
